[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "next-gen-scrapy"
version = "0.6.2"
description = "Scrape NFL Next Gen Stats pass/route/carry charts, extract field coordinates from the chart images, and match them to play-by-play"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Joseph", email = "rjseph007@gmail.com" }]
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "scipy>=1.9",
    "scikit-learn",
    "scikit-image",
    "opencv-python-headless",
]

[project.urls]
Homepage = "https://github.com/rj7002/next-gen-scrapy"
Repository = "https://github.com/rj7002/next-gen-scrapy"

[project.optional-dependencies]
pbp = ["nflreadpy", "pyarrow"]
plot = ["matplotlib"]

[project.scripts]
ngs-scrape = "next_gen_scrapy.scrape:main"
ngs-extract = "next_gen_scrapy.extract:main"

[tool.setuptools.packages.find]
include = ["next_gen_scrapy*"]

[tool.setuptools.package-data]
next_gen_scrapy = ["statbox_digits.npz", "route_type_model.npz", "carry_type_model.npz", "pbp_calibration.json"]
