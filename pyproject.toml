[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "next-gen-scrapy"
version = "0.2.3"
description = "Scrape NFL Next Gen Stats pass/route/carry charts and extract field coordinates from the chart images"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Joseph", email = "rjseph007@gmail.com" }]
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "opencv-python-headless",
]

[project.optional-dependencies]
pbp = ["nflreadpy", "pyarrow"]
api = ["fastapi", "uvicorn[standard]"]

[project.scripts]
ngs-scrape = "next_gen_scrapy.scrape:main"
ngs-extract = "next_gen_scrapy.extract:main"

[tool.setuptools.packages.find]
include = ["next_gen_scrapy*"]
